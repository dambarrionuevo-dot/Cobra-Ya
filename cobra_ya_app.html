<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cobra Ya</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#282D87">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cobra Ya">
<link rel="apple-touch-icon" href="icon.svg">
<script>(function(){try{if(localStorage.getItem('cy_dark')==='1')document.documentElement.classList.add('dark');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F8;--card:#FFFFFF;--ink:#1A1B26;--mut:#6B6D82;--border:rgba(20,20,40,.08);
  --navy:#282D87;--navyTint:rgba(40,45,135,.08);
  --orange:#FF9100;--orangeTint:rgba(255,145,0,.12);
  --green:#2E7D46;--greenTint:rgba(46,125,70,.10);
  --red:#B0362E;--redTint:rgba(176,54,46,.10);
  --cardShadow:0 1px 1px rgba(20,20,40,.03), 0 6px 16px rgba(20,20,40,.07), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(20,20,40,.04);
}
:root.dark{
  --bg:#14151C;--card:#1E1F2C;--ink:#F1F1F5;--mut:#9092A8;--border:rgba(255,255,255,.09);
  --navy:#7A7FE0;--orange:#FFB25C;--green:#5FCB86;--red:#F0776E;
  --navyTint:rgba(122,127,224,.16);--orangeTint:rgba(255,178,92,.16);--greenTint:rgba(95,203,134,.14);--redTint:rgba(240,119,110,.14);
  --cardShadow:0 1px 1px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{max-width:430px;margin:0 auto;height:100dvh;height:100vh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.2);position:relative;overflow:hidden}

/* HEADER */
.hdr{flex-shrink:0;background:linear-gradient(160deg,#1B1F5C 0%,#282D87 45%,#6E72C4 100%);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 22px;position:relative}
:root.dark .hdr{background:linear-gradient(160deg,#0B0C1A 0%,#1B1E3D 55%,#33366B 100%)}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start}
.hdr-title{font-size:1.5rem;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.1}
.hdr-sub{font-size:.78rem;color:var(--orange);font-weight:600;margin-top:5px}
.hdr-logo{width:62px;flex-shrink:0;padding-top:2px}
.hdr-logo img{width:100%;display:block}

/* EJERCICIO SWITCH */
.ejsw{flex-shrink:0;background:var(--card);padding:12px 16px 10px;display:flex;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.ejpill{padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);color:var(--ink);font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit}
.ejpill.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}

/* PERIOD CONTROL ROW */
.pctrl{flex-shrink:0;background:var(--card);padding:6px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.ppill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--navy);border:none;font-size:.78rem;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
.pctrl .spacer{flex:1}
.cmptog{width:44px;height:25px;border-radius:999px;background:var(--border);border:none;cursor:pointer;padding:2px;flex-shrink:0;position:relative}
.cmptog.on{background:var(--navy)}
.cmptog-knob{display:block;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transform:translateX(0);transition:transform .15s}
.cmptog.on .cmptog-knob{transform:translateX(19px)}
.darkbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}

/* SCROLL CONTENT */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 18px}
.warn-banner{font-size:.68rem;color:var(--orange);background:var(--orangeTint);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-weight:600;display:none}
.tab-content{display:none}.tab-content.active{display:block}

/* SECTION LABEL */
.stitle{display:inline-flex;align-items:center;font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#fff;background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:10px}
.mt{margin-top:16px}

/* HERO */
.hero{background:var(--card);box-shadow:var(--cardShadow);border-radius:20px;padding:18px 18px 14px;margin-bottom:12px}
.hero-eyebrow{font-size:.68rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.hero-value{font-size:2.1rem;font-weight:800;letter-spacing:-.5px;line-height:1;color:var(--ink)}
.hero-delta{margin-top:5px;font-size:.82rem;font-weight:700}
.hero-delta-vs{color:var(--mut);font-weight:600}

/* RESUMEN TILES */
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{grid-column:span 1;background:var(--card);box-shadow:var(--cardShadow);border-radius:18px;padding:14px 15px;transition:grid-column .15s}
.tile.exp{grid-column:1/-1}
.tile-hdr{display:flex;align-items:center;width:100%;background:transparent;border:none;padding:0;cursor:pointer;font-family:inherit;gap:8px}
.tile-ic{width:24px;height:24px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile-lbl{font-size:.62rem;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-weight:700;flex:1;text-align:left}
.tile-chev{transition:transform .15s;flex-shrink:0}
.tile-chev.up{transform:rotate(180deg)}
.tile-val{font-size:1.55rem;font-weight:800;margin-top:12px;letter-spacing:-.3px}
.tile-delta{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.5);font-size:.66rem;font-weight:700}
:root.dark .tile-delta{background:rgba(255,255,255,.08)}
.ekg-wrap{margin-top:10px;padding:10px 11px 6px;border-radius:11px;background:var(--bg);position:relative}
.ekg-svg{width:100%;height:46px;display:block}
.ekg-lbl{position:absolute;transform:translate(-50%,-120%);font-size:8.5px;font-weight:700;color:var(--mut);white-space:nowrap}

/* INSIGHTS ROW */
.insights-row{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 14px;cursor:pointer;font-family:inherit;margin-bottom:8px}
.insights-row-l{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--ink)}
.insights-row-r{font-size:.72rem;color:var(--mut);font-weight:700}

/* GENERIC EXPANDABLE CARD (Evolución / Adopción) */
.card2{background:var(--card);box-shadow:var(--cardShadow);border-radius:16px;padding:14px 15px;margin-bottom:10px}
.card2-hdr{display:flex;align-items:center;width:100%;background:transparent;border:none;padding:0;cursor:pointer;font-family:inherit;gap:9px}
.card2-ic{width:26px;height:26px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card2-title{font-size:.7rem;color:var(--ink);font-weight:700;flex:1;text-align:left}
.card2-title-static{font-size:.7rem;color:var(--ink);font-weight:700;margin-bottom:10px}

.stat2{display:flex;align-items:stretch;margin-top:12px}
.stat2.one{justify-content:center}
.stat2-col{flex:1;text-align:center}
.stat2-col.b{border-left:1px solid var(--border)}
.stat2-lbl{font-size:.6rem;color:var(--mut);text-transform:uppercase;font-weight:700;letter-spacing:.3px}
.stat2-val{font-size:1.5rem;font-weight:800;letter-spacing:-.3px;margin-top:2px}
.stat2-note{font-size:.72rem;color:var(--mut);margin-top:12px}

/* SNAPSHOT GRIDS (Evolución compare / Adopción KPI) */
.snap-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 8px}
.snap-grid.four{grid-template-columns:1fr 1fr}
.snap-lbl{font-size:.6rem;color:var(--mut);text-transform:uppercase;text-align:left}
.snap-val{font-size:.92rem;font-weight:800;margin-top:2px}
.snap-grid.four .snap-val{font-size:1.25rem;text-align:center}
.snap-grid.four .snap-lbl{text-align:center}
.snap-delta{font-size:.66rem;font-weight:700;color:var(--mut);margin-top:1px}

/* BARS (shared by every bar chart) */
.exp-wrap{margin-top:10px;padding:10px 11px 6px;border-radius:11px;background:var(--bg)}
.bars{display:flex;align-items:stretch;gap:4px}
.barcol{flex:1;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.barcol-fillwrap{flex:1;display:flex;align-items:flex-end;gap:1.5px;width:100%}
.barfill{flex:1;min-width:2px;border-radius:2px 2px 0 0}
.barcap{height:11px;font-size:6.3px;font-weight:800;color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;margin-top:2px}
.divtrack{flex:1;position:relative;min-height:50px}
.divmid{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border)}
.divbody{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.divbar{width:100%;min-width:3px}
.divbar.pos{align-self:flex-end;border-radius:2px 2px 0 0;background:var(--green)}
.divbar.neg{align-self:flex-start;border-radius:0 0 2px 2px;background:var(--red)}

/* RANKING LIST */
.rankrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.rankrow:first-child{border-top:none}
.rankbadge{width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--mut);font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rankname{flex:1;font-size:.74rem;font-weight:600;line-height:1.3}
.rankops{font-size:.68rem;color:var(--mut);flex-shrink:0}
.rankmonto{font-size:.78rem;font-weight:800;flex-shrink:0}
.ranknote{font-size:.68rem;color:var(--mut);margin-top:10px}

.nodata-card{text-align:center;padding:16px}
.nodata-title{font-size:.8rem;font-weight:700;margin-bottom:4px}
.nodata-body{font-size:.74rem;color:var(--mut);line-height:1.5}

/* DATOS TABLE */
.tw{overflow-x:auto;border-radius:16px;margin-bottom:12px;box-shadow:var(--cardShadow);background:var(--card)}
table.dtable{width:100%;border-collapse:collapse;font-size:.72rem;table-layout:fixed;min-width:560px}
.dtable thead th{background:var(--navy);color:#fff;padding:8px 9px;text-align:left;font-size:.6rem;font-weight:700;text-transform:uppercase;white-space:nowrap}
.dtable thead th.r{text-align:right}.dtable thead th.c{text-align:center}
.dtable thead th.mescol,.dtable td.mescol{position:sticky;left:0}
.dtable thead th.mescol{z-index:3;box-shadow:2px 0 4px rgba(0,0,0,.1)}
.dtable td.mescol{z-index:2;box-shadow:2px 0 4px rgba(0,0,0,.06)}
.dtable td{padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
.dtable td.r{text-align:right}.dtable td.c{text-align:center}
.dtable td.mescol{background:var(--card);font-weight:700}
.dtable tr.sel-row td{background:var(--navyTint)}
.dtable tr.row-tot td{background:var(--bg);font-weight:800}
.seldot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--navy);margin-right:5px}

/* NOTA */
.nota{font-size:.7rem;color:var(--mut);background:var(--orangeTint);border-left:3px solid var(--orange);border-radius:8px;padding:9px 12px;margin-top:10px}

/* CARGAR FORM */
.card{background:var(--card);box-shadow:var(--cardShadow);border-radius:16px;padding:16px;margin-bottom:12px}
.ct{font-size:.7rem;color:var(--ink);font-weight:700;margin-bottom:10px}
.fsub{font-size:.62rem;font-weight:700;color:var(--orange);text-transform:uppercase;display:block;margin:10px 0 7px;padding-bottom:3px;border-bottom:1px solid var(--orangeTint)}
.fg{margin-bottom:9px}
.fg label{font-size:.62rem;font-weight:700;color:var(--navy);text-transform:uppercase;display:block;margin-bottom:3px}
.fg input{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;background:var(--bg);color:var(--ink)}
.fg input:focus{outline:none;border-color:var(--navy);background:var(--card)}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.btn{display:block;width:100%;padding:12px;border-radius:999px;border:none;font-size:.82rem;font-weight:700;cursor:pointer;margin-bottom:7px;font-family:inherit}
.btn-p{background:var(--navy);color:#fff}
.btn-s{background:var(--orange);color:#fff}
.btn-o{background:transparent;border:1.5px solid var(--navy);color:var(--navy)}
.fzone{border:2px dashed var(--border);border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;margin-bottom:10px;position:relative}
.fzone .fz-ic{font-size:1.8rem;margin-bottom:6px}
.fzone p{font-size:.78rem;color:var(--mut);line-height:1.5}
.fzone strong{color:var(--navy)}
.fzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.mi{background:var(--card);box-shadow:var(--cardShadow);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mi-l{font-weight:800;font-size:.85rem}
.mi-s{font-size:.66rem;color:var(--mut);margin-top:3px}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:.8rem;flex-shrink:0}
.iconbtn.ro{border-color:var(--red);color:var(--red)}
.prev-box{background:var(--bg);border-radius:10px;padding:12px;margin:10px 0;display:none}
.prev-row{display:flex;justify-content:space-between;font-size:.76rem;padding:3px 0;border-bottom:1px solid var(--border)}
.prev-row:last-child{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.65rem;font-weight:700}
.b-na{background:var(--orangeTint);color:var(--orange)}

/* HELPERS */
.pos{color:var(--green)!important;font-weight:700}.neg{color:var(--red)!important;font-weight:700}

/* BOTTOM NAV */
.bottom-nav{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 4px 18px rgba(0,0,0,.10);margin:0 14px calc(28px + env(safe-area-inset-bottom,0px));padding:6px;position:relative;z-index:5}
.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.nav-ind{position:absolute;top:0;bottom:0;width:20%;left:0;background:var(--orangeTint);border-radius:14px;transition:left 260ms cubic-bezier(0.34,1.2,0.64,1)}
.ni{position:relative;z-index:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:8px 2px 6px;border:none;background:transparent;color:var(--mut);font-size:.56rem;font-weight:700;transition:color .16s ease;font-family:inherit;display:flex}
.ni.on{color:var(--orange)}
.ni svg{width:19px;height:19px}

/* MODALS */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}
.scrim.show{display:block}
.sheet{position:absolute;left:0;right:0;top:-100%;background:var(--card);border-radius:0 0 22px 22px;z-index:11;max-height:70%;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2);transition:top .2s ease}
.sheet.show{top:0}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:4px auto 10px;flex-shrink:0;order:2}
.sheet-title{padding:6px 18px 4px;font-size:.9rem;font-weight:800;color:var(--ink);flex-shrink:0}
.sheet-list{overflow-y:auto;padding:4px 10px 8px;flex:1;min-height:0}
.sheet-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 10px;border:none;background:transparent;cursor:pointer;font-family:inherit;border-bottom:1px solid var(--border);color:var(--ink)}
.sheet-row:last-child{border-bottom:none}
.sheet-monto{font-size:.72rem;color:var(--mut)}
.sheet-dot{width:9px;height:9px;border-radius:50%;background:var(--navy);display:inline-block}

.insights-modal{position:absolute;left:16px;right:16px;top:50%;background:var(--card);border-radius:18px;z-index:11;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:6px 16px 14px;opacity:0;pointer-events:none;transform:translateY(calc(-50% + 12px));transition:opacity .15s, transform .15s}
.insights-modal.show{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.insights-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.insights-hdr-title{font-size:.9rem;font-weight:800;color:var(--ink)}
.insights-close{width:26px;height:26px;border-radius:50%;background:var(--bg);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.insight-row{padding:12px;border-radius:12px;background:var(--bg);display:flex;gap:10px;margin-bottom:8px}
.insight-row:last-child{margin-bottom:0}
.insight-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px}
.insight-title{font-size:.82rem;font-weight:700;margin-bottom:2px;color:var(--ink)}
.insight-body{font-size:.76rem;color:var(--mut);line-height:1.5}
</style>
</head>
<body>
<div class="app">

<div class="hdr">
  <div class="hdr-row">
    <div>
      <div class="hdr-title">Cobra Ya</div>
      <div class="hdr-sub">Adopción y Desempeño</div>
    </div>
    <div class="hdr-logo"><img src="aca-logo-white.png" alt="ACA"></div>
  </div>
</div>

<div class="ejsw">
  <button class="ejpill" id="ej-2627" onclick="selectEjercicio('2026/27')">Ejercicio 2026/27</button>
  <button class="ejpill" id="ej-2526" onclick="selectEjercicio('2025/26')">Ejercicio 2025/26</button>
</div>

<div class="pctrl">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
  <button class="ppill" onclick="openSheet()"><span id="period-pill-label">Consolidado</span><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
  <div class="spacer"></div>
  <button class="cmptog" id="compare-toggle" onclick="toggleCompare()"><span class="cmptog-knob"></span></button>
  <button class="darkbtn" id="dark-toggle" onclick="toggleDark()"></button>
</div>

<div class="content">
  <div class="warn-banner" id="ej-warning"></div>

  <div id="tab-0" class="tab-content active"><div id="res-content"></div></div>
  <div id="tab-1" class="tab-content"><div id="evol-content"></div></div>
  <div id="tab-2" class="tab-content"><div id="adop-content"></div></div>
  <div id="tab-3" class="tab-content"><div id="datos-content"></div></div>
  <div id="tab-4" class="tab-content"><div id="cargar-content"></div></div>
</div><!-- /content -->

<nav class="bottom-nav">
<div class="nav-grid">
  <div class="nav-ind" id="nav-ind"></div>
  <button class="ni on" onclick="showTab(0,this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
    Resumen
  </button>
  <button class="ni" onclick="showTab(1,this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
    Evolución

function loadState(){
  let stored=null;
  try{ const raw=localStorage.getItem('cy_v8'); if(raw) stored=JSON.parse(raw); }catch(e){ stored=null; }
  if(stored && stored.data){
    EJERCICIOS = stored.data;

  } else {
    let prev=null;
    try{ const rawPrev=localStorage.getItem('cy_v7'); if(rawPrev) prev=JSON.parse(rawPrev); }catch(e){ prev=null; }
    let old=null;
    if(!prev){ try{ const rawOld=localStorage.getItem('cy_v6'); if(rawOld) old=JSON.parse(rawOld); }catch(e){ old=null; } }
    EJERCICIOS = {};
    EJERCICIOS['2025/26'] = (prev && prev.data && Array.isArray(prev.data['2025/26'])) ? prev.data['2025/26']

    EJERCICIOS['2026/27'] = JSON.parse(JSON.stringify(EJERCICIOS_SEED['2026/27']));
    EJ_PLACEHOLDER = {};
    saveState();
  }
  if(!EJERCICIOS['2025/26']) EJERCICIOS['2025/26']=JSON.parse(JSON.stringify(EJERCICIOS_SEED['2025/26']));
  if(!EJERCICIOS['2026/27']) EJERCICIOS['2026/27']=JSON.parse(JSON.stringify(EJERCICIOS_SEED['2026/27']));

  months = EJERCICIOS[ejercicio];
  months.sort((a,b)=>a.id.localeCompare(b.id));
  selPer = months.length ? months[months.length-1].id : 'all';
}

}

function getPrev(m){ const i=months.findIndex(x=>x.id===m.id); return i>0?months[i-1]:null; }
function pctInfo(cur,prev){
  if(prev===null||prev===undefined||prev===0) return {text:'Primer mes',positive:true};
  const p=(cur-prev)/Math.abs(prev)*100;
  return {text:(p>=0?'▲ +':'▼ ')+Math.abs(p).toFixed(1)+'%', positive:p>=0};
}

// ===== CHART ENGINE (custom SVG/HTML, no Chart.js) =====
function ekg(arr,w,h){
  w=w||280; h=h||56;
  if(arr.length<2) arr=[arr[0]||0,arr[0]||0];
  const min=Math.min.apply(null,arr), max=Math.max.apply(null,arr);
  const range=(max-min)||1;
  const base=h-10, n=arr.length, segW=w/n;
  let pts=[], labels=[];
  arr.forEach((v,i)=>{
    const x0=i*segW;
    const norm=(v-min)/range;
    const peakY=14+(1-norm)*(base-26);
    pts.push((x0).toFixed(1)+','+base);
    pts.push((x0+segW*0.28).toFixed(1)+','+(base+4).toFixed(1));
    pts.push((x0+segW*0.42).toFixed(1)+','+peakY.toFixed(1));
    pts.push((x0+segW*0.5).toFixed(1)+','+(base+8).toFixed(1));
    pts.push((x0+segW*0.62).toFixed(1)+','+(base-3).toFixed(1));
    pts.push((x0+segW*0.85).toFixed(1)+','+base);
    let lbl='–';
    if(i>0 && arr[i-1]){ const p=((v-arr[i-1])/Math.abs(arr[i-1]))*100; lbl=(p>=0?'+':'')+p.toFixed(0)+'%'; }
    const lx=x0+segW*0.42, ly=Math.max(peakY-8,9);
    labels.push({xPct:(lx/w*100).toFixed(1), yPct:(ly/h*100).toFixed(1), text:lbl});
  });
  pts.push(w+','+base);
  return {points:pts.join(' '), labels};
}
function barsSingle(arr){
  const max=Math.max.apply(null,arr)||1;
  return arr.map(v=>({h:Math.max(6,(v/max*100)).toFixed(1)}));
}
function barsGrouped(a,b){
  const A=barsSingle(a), B=barsSingle(b);
  return A.map((x,i)=>({hA:x.h,hB:B[i].h}));
}
function barsDiverge(arr){
  const maxAbs=Math.max.apply(null,arr.map(Math.abs))||1;
  return arr.map(v=>({h:(Math.abs(v)/maxAbs*100).toFixed(1), pos:v>=0}));
}
function selOpTag(monthsArr,i){
  const hasSel = selPer!=='all';
  const isSel = hasSel && monthsArr[i] && monthsArr[i].id===selPer;
  return {op:(!hasSel||isSel)?1:0.3, tag:isSel?monthsArr[i].label:''};
}
function isActiveTip(chartId,i){ return activeTooltip.chart===chartId && activeTooltip.i===i; }
function setTip(chartId,i){
  activeTooltip = (activeTooltip.chart===chartId && activeTooltip.i===i) ? {chart:null,i:null} : {chart:chartId,i:i};
  renderTab(activeTab);
}
function prepBars(arr,monthsArr,color,chartId,fmt){
  return barsSingle(arr).map((b,i)=>{
    const s=selOpTag(monthsArr,i), active=isActiveTip(chartId,i);
    const lbl=monthsArr[i]?monthsArr[i].label:'';
    return {h:b.h,bg:color,op:s.op,cap:active?(lbl+': '+fmt(arr[i])):s.tag,onTap:`setTip('${chartId}',${i})`};
  });
}
function prepBarsGrouped(a,b,monthsArr,colorA,colorB,chartId,fmtA,fmtB,labelA,labelB){
  return barsGrouped(a,b).map((x,i)=>{
    const s=selOpTag(monthsArr,i), active=isActiveTip(chartId,i);
    const lbl=monthsArr[i]?monthsArr[i].label:'';
    const full=lbl+' — '+labelA+': '+fmtA(a[i])+' · '+labelB+': '+fmtB(b[i]);
    return {hA:x.hA,hB:x.hB,bgA:colorA,bgB:colorB,op:s.op,cap:active?full:s.tag,onTap:`setTip('${chartId}',${i})`};
  });
}
function prepBarsDiverge(arr,monthsArr,chartId){
  return barsDiverge(arr).map((b,i)=>{
    const s=selOpTag(monthsArr,i), active=isActiveTip(chartId,i);
    const lbl=monthsArr[i]?monthsArr[i].label:'';
    const txt=(arr[i]>=0?'+':'')+arr[i].toFixed(1)+'%';
    return {h:b.h,pos:b.pos,op:s.op,cap:active?(lbl+': '+txt):s.tag,onTap:`setTip('${chartId}',${i})`};
  });
}
function prepCategorical(arr,labelsArr,colorsArr,chartId,fmt){
  return barsSingle(arr).map((b,i)=>{
    const active=isActiveTip(chartId,i);
    return {h:b.h,bg:colorsArr[i],cap:active?(labelsArr[i]+': '+fmt(arr[i])):labelsArr[i],onTap:`setTip('${chartId}',${i})`};
  });
}
function barsHTML(items,mode,heightPx){
  heightPx = heightPx || 58;
  const cols = items.map(b=>{
    let inner;
    if(mode==='grouped'){
      inner = `<div class="barcol-fillwrap"><div class="barfill" style="height:${b.hA}%;background:${b.bgA};opacity:${b.op}"></div><div class="barfill" style="height:${b.hB}%;background:${b.bgB};opacity:${b.op}"></div></div>`;
    } else if(mode==='diverge'){
      inner = `<div class="divtrack"><div class="divmid"></div><div class="divbody"><div class="divbar ${b.pos?'pos':'neg'}" style="height:${b.h}%;opacity:${b.op}"></div></div></div>`;
    } else {
      inner = `<div class="barcol-fillwrap"><div class="barfill" style="height:${b.h}%;background:${b.bg};opacity:${b.op===undefined?1:b.op}"></div></div>`;
    }
    return `<div class="barcol" onclick="${b.onTap}">${inner}<div class="barcap">${b.cap}</div></div>`;
  }).join('');
  return `<div class="bars" style="height:${heightPx}px">${cols}</div>`;
}

function renderInsights(){
  const body=document.getElementById('insights-body');
  let rows=[];
  if(activeTab===0){
    const sel=getSel();
    if(sel){
      const p=getPrev(sel);
      const d=pctInfo(sel.monto,p?p.monto:null);
      rows=[
        {color:'var(--green)',title:'Variación vs mes anterior',body:p?('Monto '+d.text+' respecto a '+p.label+'.'):'Primer mes del periodo, sin comparación disponible.'},
        {color:'var(--navy)',title: sel.pend>100?'Pendientes elevados':'Pendientes bajo control', body: fmN(sel.pend)+' solicitudes pendientes en '+sel.label+'.'}
      ];
    } else {
      const first=months[0], last=months[months.length-1];
      const crec=((last.monto-first.monto)/first.monto*100).toFixed(1);
      const transpCrec=((last.transp-first.transp)/first.transp*100).toFixed(1);
      rows=[
        {color:'var(--green)',title:'Crecimiento sostenido',body:'El monto solicitado creció '+crec+'% entre '+first.label+' y '+last.label+'.'},
        {color:'var(--navy)',title:'Flota en expansión',body:'Los transportes activos crecieron '+transpCrec+'% en el periodo, sumando '+fmN(last.transp-first.transp)+' unidades.'}
      ];
    }
  } else if(activeTab===1){
    const diffs=months.slice(1).map((m,i)=>({label:m.label,v:(m.monto-months[i].monto)/months[i].monto*100}));
    if(diffs.length){
      const best=diffs.reduce((a,b)=>b.v>a.v?b:a,diffs[0]);
      const worst=diffs.reduce((a,b)=>b.v<a.v?b:a,diffs[0]);
      rows=[
        {color:'var(--green)',title:'Mejor mes: '+best.label,body:'Creció '+best.v.toFixed(1)+'% respecto al mes previo — el mayor salto del ejercicio.'},
        {color:'var(--red)',title:'Mayor caída: '+worst.label,body: worst.v>=0?'Sin caídas relevantes en el ejercicio.':(worst.v.toFixed(1)+'% respecto al mes previo.')}
      ];
    } else {
      rows=[
        {color:'var(--navy)',title:'Ejercicio en curso',body:'Todavía no hay suficientes meses para comparar variaciones.'},
        {color:'var(--mut)',title:'Datos preliminares',body:'Se irán completando insights a medida que carguen más meses.'}
      ];
    }
  }
  body.innerHTML = rows.map(r=>`<div class="insight-row"><span class="insight-dot" style="background:${r.color}"></span><div><div class="insight-title">${r.title}</div><div class="insight-body">${r.body}</div></div></div>`).join('');
}

// ===== EVOLUCIÓN =====
function renderEvol(){
  const sel=getSel(), p=sel?getPrev(sel):null;
  let snapHtml='';
  if(sel){
    const rows=[['Solicitado',sel.monto,p&&p.monto,fmM],['Comisiones',sel.cobrado,p&&p.cobrado,fmM],['Aprobadas',sel.apro,p&&p.apro,fmN],['Pendientes',sel.pend,p&&p.pend,fmN],['Transp.',sel.transp,p&&p.transp,fmN],['Nuevos',sel.nuevos,p&&p.nuevos,fmN]];
    snapHtml = `<div class="card2">
      <div class="hero-eyebrow">${sel.label} vs ${p?p.label:'—'}</div>
      <div class="snap-grid">
      ${rows.map(([lbl,cur,prev,fmt])=>{
        const d=p?pctInfo(cur,prev):{text:'Primer mes',positive:true};
        return `<div><div class="snap-lbl">${lbl}</div><div class="snap-val">${fmt(cur)}</div><div class="snap-delta">${d.text}</div></div>`;
      }).join('')}
      </div>
    </div>`;
  }
  const L=months;
  let cum=0; const cumArr=L.map(m=>{cum+=m.nuevos;return cum;});

// ===== ADOPCIÓN =====
function renderAdop(){
  const sel=getSel();
  const hasRetentionData = ejercicio==='2025/26'; // histograma de "meses de uso" necesita un año completo de historial
  const adRecArr = months.map(m=>m.transp-m.nuevos);
  let adTranspVal,adRecurrentesVal,adNuevosVal,adRetencionVal,adHasFlete,adFletePct,adFleteSub;

  if(sel){
    const rec=sel.transp-sel.nuevos;
    adTranspVal=fmN(sel.transp); adRecurrentesVal=fmN(rec); adNuevosVal=fmN(sel.nuevos);
    adRetencionVal = sel.transp>0?((rec/sel.transp)*100).toFixed(1)+'%':'—';
    const mkt=ADOPCION_MKT[sel.id];
    adHasFlete=!!mkt; adFletePct=mkt?mkt.pct+'%':''; adFleteSub=mkt?('sobre $'+fmN(mkt.flete)+' M de flete total'):'';
  } else {
    const last=months[months.length-1];
    const totNuevos=months.reduce((s,m)=>s+m.nuevos,0);
    adTranspVal=fmN(last.transp); adRecurrentesVal=fmN(last.transp-last.nuevos); adNuevosVal=fmN(totNuevos);
    adRetencionVal = last.transp>0?(((last.transp-last.nuevos)/last.transp)*100).toFixed(1)+'%':'—';
    const mktKeys=Object.keys(ADOPCION_MKT);
    const mktLast = mktKeys.length ? ADOPCION_MKT[mktKeys[mktKeys.length-1]] : null;
    adHasFlete=!!mktLast; adFletePct=mktLast?mktLast.pct+'%':''; adFleteSub=mktLast?'último dato disponible':'';
  }

  const expNR=expandedCard==='ad-a';
  const cardNR = card2Tpl('ad-a',expNR,'var(--orange)',icoPlus,'Nuevos vs Recurrentes por Mes',
    `<div class="stat2"><div class="stat2-col"><div class="stat2-lbl">Recurrentes</div><div class="stat2-val" style="color:var(--green)">${adRecurrentesVal}</div></div><div class="stat2-col b"><div class="stat2-lbl">Nuevos</div><div class="stat2-val" style="color:var(--orange)">${adNuevosVal}</div></div></div>`,
    expNR?barsHTML(prepBarsGrouped(months.map(m=>m.nuevos),adRecArr,months,'var(--orange)','var(--green)','a-a',fmN,fmN,'Nuevos','Recurrentes'),'grouped',66):'');

  // "Adopción sobre el Mercado" depende solo de tener flete cargado ese mes/ejercicio, no del ejercicio en sí
  let fleteCard='';
  if(adHasFlete){
    const expFlete=expandedCard==='ad-b';
    const fleteMonths=months.filter(m=>ADOPCION_MKT[m.id]);
    const fleteBars=prepBars(fleteMonths.map(m=>ADOPCION_MKT[m.id].pct),fleteMonths,'var(--navy)','a-b',v=>v+'%');
    fleteCard = card2Tpl('ad-b',expFlete,'var(--navy)',icoTrend,'Adopción sobre el Mercado',
      `<div class="stat2 one"><div class="stat2-col"><div class="stat2-val" style="color:var(--navy)">${adFletePct}</div><div class="stat2-lbl" style="text-transform:none;font-weight:600">${adFleteSub}</div></div></div>`,
      expFlete?barsHTML(fleteBars,'single',62):'');
  }

  // Histograma "meses de uso" necesita un ejercicio completo de historial -> sigue gateado a 2025/26
  let retentionHtml='';
  if(hasRetentionData){
    const adUnicos=months.reduce((s,m)=>s+m.nuevos,0);
    const cnt5=RETCNT.slice(4).reduce((a,b)=>a+b,0);
    const ad5MasVal=fmN(cnt5), ad5MasPct=Math.round(cnt5/adUnicos*1000)/10;
    const idxAll = RETCNT[months.length-1]!==undefined ? RETCNT[months.length-1] : RETCNT[RETCNT.length-1];
    const adTodosMesesVal=fmN(idxAll), adSolo1Val=fmN(RETCNT[0]);

    const expRet=expandedCard==='ad-c';
    const retCard = card2Tpl('ad-c',expRet,'var(--green)',icoShield,'Transportes según Meses de Uso',
      `<div class="stat2"><div class="stat2-col"><div class="stat2-lbl">Núcleo fiel</div><div class="stat2-val" style="color:var(--green)">${adTodosMesesVal}</div></div><div class="stat2-col b"><div class="stat2-lbl">Riesgo churn</div><div class="stat2-val" style="color:var(--red)">${adSolo1Val}</div></div></div>`,
      expRet?barsHTML(prepCategorical(RETCNT,RETLBLS,RETCOL,'a-c',v=>fmN(v)+' transp.'),'categorical',62):'');

    const expMonto=expandedCard==='ad-d';
    const montoCard = card2Tpl('ad-d',expMonto,'var(--orange)',icoComis,'Monto por Profundidad de Uso',
      `<div class="stat2-note">${ad5MasVal} transportes usaron 5 o más meses (${ad5MasPct}% del total).</div>`,
      expMonto?barsHTML(prepCategorical(RETMS,RETLBLS,RETCOL,'a-d',fmM),'categorical',62):'');

    retentionHtml = `${retCard}${montoCard}`;
  } else {
    retentionHtml = `<div class="card2 nodata-card">
      <div class="nodata-title">Sin historial suficiente para retención</div>
      <div class="nodata-body">El histograma de meses de uso necesita un ejercicio completo cargado. Disponible hoy para Ejercicio 2025/26.</div>
    </div>`;
  }

  // Ranking: usa el ranking propio del mes (cargado por Excel/manual) si existe, sin importar el ejercicio;
  // si no hay mes seleccionado, el top-15 consolidado solo existe hardcodeado para 2025/26.
  let rankTitle,rankRows,rankNote;
  if(sel && sel.ranking && sel.ranking.length){
    rankTitle='Top Transportes — '+sel.label;
    rankRows=sel.ranking.map((r,i)=>({rank:i+1,n:r.n,ops:r.ops,monto:r.monto}));
    rankNote=(sel.rankingPct!=null?'Representan el '+sel.rankingPct+'% del monto de '+sel.label+'.':'Top 15 transportes de '+sel.label+'.');
  } else if(sel && RANKING_MES[sel.id]){
    rankTitle='Top Transportes — '+sel.label;
    rankRows=RANKING_MES[sel.id].items.map((r,i)=>({rank:i+1,n:r.n,ops:r.ops,monto:'$'+r.monto.toLocaleString('es-AR')+' M'}));
    rankNote='Representan el '+RANKING_MES[sel.id].pct+'% del monto de '+sel.label+'.';
  } else if(sel){
    rankTitle='Top Transportes — '+sel.label;
    rankRows=[];
    rankNote='Sin ranking específico de '+sel.label+'. Cargá el Excel del mes para verlo.';
  } else if(ejercicio==='2025/26'){
    rankTitle='Top 15 Transportes por Volumen';
    rankRows=RANKING.map((r,i)=>({rank:i+1,n:r.n,ops:r.ops,monto:r.monto}));
    rankNote='Representan el '+RANKING_NOTA_PCT+'% del monto total del ejercicio.';
  } else {
    rankTitle='Top Transportes por Volumen';
    rankRows=[];
    rankNote='Elegí un mes específico para ver su ranking, o cargá todos los meses del ejercicio para un consolidado.';
  }
  const rankCard = `<div class="card2">
    <div class="card2-title-static">${rankTitle}</div>
    ${rankRows.length? rankRows.map(r=>`<div class="rankrow"><span class="rankbadge">${r.rank}</span><span class="rankname">${r.n}</span><span class="rankops">${r.ops} ops</span><span class="rankmonto">${typeof r.monto==='number'?'$'+r.monto.toLocaleString('es-AR')+' M':r.monto}</span></div>`).join('') : '<div class="stat2-note">Sin datos de ranking.</div>'}
    <div class="ranknote">${rankNote}</div>
  </div>`;

  const gatedHtml = `${fleteCard}${retentionHtml}${rankCard}`;

  document.getElementById('adop-content').innerHTML = `
    <div class="card2">
      <div class="snap-grid four">
        <div><div class="snap-lbl">Transp. Activos</div><div class="snap-val" style="color:var(--navy)">${adTranspVal}</div></div>
        <div><div class="snap-lbl">Recurrentes</div><div class="snap-val" style="color:var(--green)">${adRecurrentesVal}</div></div>
        <div><div class="snap-lbl">Nuevos</div><div class="snap-val" style="color:var(--orange)">${adNuevosVal}</div></div>
        <div><div class="snap-lbl">Retención</div><div class="snap-val">${adRetencionVal}</div></div>
      </div>
    </div>
    ${cardNR}
    ${gatedHtml}
  `;
}

function editMonth(id){

function importJSON(){
  const raw=(document.getElementById('imp-json').value||'').trim();

  try{
    let data=JSON.parse(raw); if(!Array.isArray(data)) data=[data];

    months.sort((a,b)=>a.id.localeCompare(b.id));

    EJ_PLACEHOLDER[ejercicio]=false;
    saveState(); sv('imp-json',''); renderShell(); renderTab(activeTab); alert('✓ Importado.');
  }catch(e){alert('JSON inválido: '+e.message);}
}

// ===== EXCEL IMPORT PIPELINE (parsing logic unchanged) =====
async function handleFile(inp){
  const file=inp.files[0]; if(!file) return;
  document.getElementById('fname').textContent='📄 '+file.name;
  document.getElementById('fname').style.display='block';
  const filenameInfo=parseFilename(file.name);
  try{
    if(typeof XLSX==='undefined'){alert('Cargando librería Excel, intentá de nuevo en unos segundos.');return;}
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const parsed=parseCYExcel(wb,filenameInfo);
    if(parsed){pendImport=parsed;showPreview(parsed);}
    else alert('No se pudo detectar el formato. Usá la carga manual.');
  }catch(e){alert('Error al leer el archivo: '+e.message);}
}

function parseFilename(name) {
  const ms={ene:'01',feb:'02',mar:'03',abr:'04',may:'05',jun:'06',jul:'07',ago:'08',sep:'09',oct:'10',nov:'11',dic:'12'};
  const match=name.match(/(\w{3,4})[.\s_-]*(\d{2,4})/i);
  if(!match) return null;
  const mesKey=match[1].toLowerCase().substring(0,3);
  const mon=ms[mesKey]; if(!mon) return null;
  const yr=parseInt(match[2]); const year=yr<100?2000+yr:yr;
  const label=match[1].charAt(0).toUpperCase()+match[1].slice(1,3).toLowerCase()+'-'+String(yr).padStart(2,'0');
  return {id:`${year}-${mon}`,label};
}

function parseCYExcel(wb,fi) {
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let hRow=-1,hdrs=[];
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=rows[i].map(c=>String(c).toLowerCase().trim());
    if(r.some(c=>/importe|monto|comis|estado|cuit/.test(c))){hRow=i;hdrs=r;break;}
  }
  if(hRow<0) return null;
  const ci=(rx)=>hdrs.findIndex(h=>rx.test(h));
  const cImp=ci(/importe|monto(?!.*comis)/), cCom=ci(/comis|cargo|fee/), cEst=ci(/estado/);
  const cEmpC=ci(/cuit_empresa/), cEmpN=ci(/nombre_empresa/);
  const cCuit=cEmpC>=0?cEmpC:ci(/cuit|empresa/);
  const cNomEmp=cEmpN>=0?cEmpN:ci(/nombre/);
  let sumImp=0,sumCom=0,nA=0,nP=0; const cuits=new Set();
  const empData={};
  const toN=v=>parseFloat(String(v).replace(/[^0-9.-]/g,''))||0;
  for(let i=hRow+1;i<rows.length;i++){
    const r=rows[i]; if(!r.length||r.every(c=>c==='')) continue;
    if(cImp>=0) sumImp+=toN(r[cImp]);
    if(cCom>=0) sumCom+=toN(r[cCom]);
    if(cEst>=0){const e=String(r[cEst]).toLowerCase();if(/aprob/.test(e))nA++;else nP++;}
    if(cCuit>=0&&r[cCuit]){
      const ck=String(r[cCuit]).trim();
      cuits.add(ck);
      const en=cNomEmp>=0&&r[cNomEmp]?String(r[cNomEmp]).trim():ck;
      if(!empData[ck]) empData[ck]={n:en,monto:0,ops:0};
      empData[ck].monto+=cImp>=0?toN(r[cImp]):0;
      empData[ck].ops++;
    }
  }
  const empArr=Object.values(empData).sort((a,b)=>b.monto-a.monto).slice(0,15);
  const empTotal=Object.values(empData).reduce((s,e)=>s+e.monto,0);
  const ranking=empArr.map(e=>({n:e.n,ops:e.ops,monto:Math.round(e.monto/1e5)/10}));
  const rankingPct=empTotal>0?Math.round(empArr.reduce((s,e)=>s+e.monto,0)/empTotal*1000)/10:null;
  const info=fi||{id:'',label:''};
  return {id:info.id||'',label:info.label||'',monto:Math.round(sumImp/1e6),cobrado:Math.round(sumCom/1e6),apro:nA||0,pend:nP||0,transp:cuits.size||0,nuevos:0,ranking,rankingPct};
}

function showPreview(m) {
  document.getElementById('prev-content').innerHTML=`
    <div style="font-weight:700;margin-bottom:8px">Datos detectados: ${m.label||'Sin período'}${!m.id?'<br><small style="color:var(--red);font-weight:400">⚠️ Período no detectado — completalo abajo</small>':''}</div>
    <div class="prev-row"><span>Monto Solicitado</span><strong>${fmM(m.monto)}</strong></div>
    <div class="prev-row"><span>Comisiones</span><strong>${fmM(m.cobrado)}</strong></div>
    <div class="prev-row"><span>Aprobadas</span><strong>${fmN(m.apro)}</strong></div>
    <div class="prev-row"><span>Pendientes</span><strong>${m.pend}</strong></div>
    <div class="prev-row"><span>Transportes (CUITs únicos)</span><strong>${fmN(m.transp)}</strong></div>
    <div class="prev-row"><span>Nuevos transportes</span><strong>— (completar manualmente)</strong></div>
    <div style="margin-top:10px;font-size:.72rem;color:var(--mut)">Verificá los valores antes de confirmar. Podés editarlos en el formulario manual si hay diferencias.</div>`;
  document.getElementById('prev-box').style.display='block';
  if(m.id){sv('fm-per',m.id);}
  if(m.label){sv('fm-lbl',m.label);}
  sv('fm-monto',m.monto); sv('fm-cob',m.cobrado); sv('fm-apro',m.apro); sv('fm-pend',m.pend); sv('fm-transp',m.transp);
}

function confirmImport(){
  if(!pendImport||!pendImport.id){alert('Completá el período en el formulario y usá "Guardar mes".');return;}
  const imp=pendImport;
  saveMonth();
  if(imp.ranking&&imp.ranking.length){
    const idx=months.findIndex(x=>x.id===imp.id);
    if(idx>=0){months[idx].ranking=imp.ranking;months[idx].rankingPct=imp.rankingPct;EJERCICIOS[ejercicio]=months;saveState();renderTab(activeTab);}
  }
  pendImport=null; cancelImport();
}
function cancelImport(){
  pendImport=null; document.getElementById('prev-box').style.display='none';
  document.getElementById('file-inp').value=''; document.getElementById('fname').style.display='none';
}
